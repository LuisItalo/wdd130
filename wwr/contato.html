<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco | Aventura Rafting &amp; Cia</title>

    <meta name="description"
      content="Entre em contato com a nossa equipe de rafting para tirar dúvidas, agendar passeios e consultar endereço, telefone, e-mail e horários de atendimento, aguardamos.">
    <meta name="author" content="Luis Italo">
    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>
    <header>
        <img src="imagens/z-raftingbw.png" alt="Logotipo da Aventura & Cia">
        <nav>
            <ul>
                <li><a href="index.html">Página Inicial</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
                <li><a href="passeios.html">Passeios</a></li>
                <li><a href="contato.html">Fale Conosco</a></li>
            </ul>
        </nav>
    </header>

    <main class="contato-main">
        <section class="empresa-cabecalho">
            <h1>Aventura Rafting &amp; Cia</h1>
            <address>
                <p>123 Rua Principal do Rio</p>
                <p>Foz do Iguaçu, Paraná</p>
                <p>+55 45 99999-9999</p>
                <p><a href="mailto:info@corredeiras.com">info@corredeiras.com</a></p>
            </address>
        </section>

        <div class="mapa-formulario">
            <div class="mapa-box">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3600.0!2d-54.5882!3d-25.5163!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMjXCsDMwJzU4LjciUyA1NMKwMzUnMTcuNSJX!5e0!3m2!1spt-BR!2sbr!4v1700000000000"
                  width="420" height="340" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"
                  title="Mapa de localização da Companhia de Rafting em Corredeiras">
                </iframe>
            </div>

            <form class="form-contato" action="#" method="post">
                <div class="linha-campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite aqui" required>
                </div>

                <div class="linha-campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite aqui" required>
                </div>

                <div class="linha-campo linha-radio">
                    <span class="rotulo-grupo">Finalidade da Mensagem</span>
                    <div class="opcoes-radio">
                        <label>
                            <input type="radio" name="finalidade" value="consulta-geral" checked>
                            Consulta Geral
                        </label>
                        <label>
                            <input type="radio" name="finalidade" value="pergunta-reserva">
                            Pergunta sobre Reserva
                        </label>
                        <label>
                            <input type="radio" name="finalidade" value="sugestao-site">
                            Sugestão de Site
                        </label>
                    </div>
                </div>

                <div class="linha-campo linha-coluna">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" rows="4" placeholder="Digite aqui" required></textarea>
                </div>

                <label class="linha-checkbox">
                    <input type="checkbox" name="newsletter" value="sim">
                    Quero receber a newsletter mensal
                </label>

                <button type="submit" class="btn-contato">Envie Aqui Sua Mensagem de Contato</button>
            </form>
        </div>

        <section class="equipe-secao">
            <h2>Estamos Aqui para Serví-lo</h2>
            <div class="equipe-grid">
                <figure>
                    <img src="imagens/free-photo-of-aventura-em-grupo-emocionante-passeio-de-rafting-em-aguas-bravas.webp" alt="Carlos Mendes, Guia Sênior de Rafting">
                    <figcaption>Carlos Mendes — Guia Sênior</figcaption>
                </figure>
                <figure>
                    <img src="imagens/360_F_650724156_fnjSXyvv1WYyB134r3oD56eVqhx5IWLD.webp" alt="Ana Paula, Coordenadora de Reservas">
                    <figcaption>Ana Paula — Coordenadora de Reservas</figcaption>
                </figure>
                <figure>
                    <img src="imagens/depositphotos_399307460-stock-photo-pacuare-river-costa-rica-march.webp" alt="Rafael Souza, Instrutor de Segurança">
                    <figcaption>Rafael Souza — Instrutor de Segurança</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Aventura Rafting & Cia - Luis Italo</p>
        <nav class="redes-sociais">
            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">
                <img src=" imagens/facebook.svg" alt="Ícone do Facebook">
            </a>
            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">
                <img src="imagens/linkedin.svg" alt="Ícone do LinkedIn">
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
                <img src="imagens/instagram.svg" alt="Ícone do Instagram">
            </a>
        </nav>
    </footer>

</body>

</html>
